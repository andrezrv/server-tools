name: Keep Repo Active

# GitHub auto-disables scheduled workflows after 60 days with no commits
# to the repo at all. This makes one, weekly, so the daily deploy
# schedule never silently stops firing from inactivity alone.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive commit"
          git push
